- name: Buscar RHSA por CVE y aplicar actualización
  hosts: all
  become: true
  vars:
    cve_id: ""    # Ej: CVE-2026-31431 (proporcionar al ejecutar)
    reboot_after_update: ""  # Si true: reinicia el sistema si se actualiza el kernel
    teams_webhook_url: ""  # URL del webhook de Teams para notificaciones (proporcionar al ejecutar)
  tasks:

    - name: Buscar advisory por CVE
      shell: dnf updateinfo list cves | grep -i "{{ cve_id }}"
      args:
        executable: /bin/bash
      register: cve_search
      changed_when: false
      failed_when: false

    - name: Extraer ID del advisory encontrado
      shell: |
        LANG=C dnf updateinfo info --cve {{ cve_id }} | grep "Update ID:" | awk -F': ' '{print $2}' | head -n 1
      args:
        executable: /bin/bash
      register: advisory_id
      changed_when: false
      failed_when: false
    - name: Mostrar advisory que se va a aplicar
      debug:
        msg: "Aplicando advisory {{ advisory_id.stdout }}"
      when: advisory_id.stdout is defined and advisory_id.stdout | trim != ''

    - name: Aplicar actualización usando el advisory
      shell: dnf -y update --advisory={{ advisory_id.stdout }}
      args:
        executable: /bin/bash
      register: update_result
      changed_when: "'Updated:' in (update_result.stdout + update_result.stderr)"
      failed_when: false
      when: advisory_id.stdout is defined and advisory_id.stdout | trim != ''

    - name: se pidió reiniciar
      reboot:
        reboot_timeout: 300
      when: (reboot_after_update) and (advisory_id.stdout is defined and advisory_id.stdout | trim != '')
  # Envolver en un bloque para asegurarnos de que la notificación siempre se envía
    - block:
        - name: Placeholder block end
          debug:
            msg: "Bloque principal completado"
      always:
        - name: Construir texto para el webhook
          set_fact:
            webhook_text: >-
              **Aplicación RHSA/actualización para CVE {{ cve_id }}**

               • **Advisory:** {{ advisory_id.stdout | default('N/A') }}

               • **Resultado búsqueda:** {{ cve_search.stdout | default('Sin resultados') }}

               • **Actualización aplicada:** {{ 'Sí' if (update_result is defined and ( (update_result.stdout | default('')) + (update_result.stderr | default('')) ) is search('Updated:')) else 'No' }}
              
               • **Salida actualización:** {{ ((update_result.stdout | default('')) + '  |  ' + (update_result.stderr | default(''))) | trim }}
              
               • **Reinicio solicitado:** {{ reboot_after_update | default('false') }}

        - name: Enviar resultado al webhook de Teams
          uri:
            url: "{{ teams_webhook_url }}"
            method: POST
            headers:
              Content-Type: "application/json"
            body: "{{ {'text': webhook_text} }}"
            body_format: json
            status_code: [200,201,202]
          ignore_errors: true