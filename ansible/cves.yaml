- name: Buscar RHSA por CVE y aplicar actualización
  hosts: all
  become: true
  vars:
    cve_id: ""    # Ej: CVE-2026-31431 (proporcionar al ejecutar)
    reboot_after_update: ""  # Si true: reinicia el sistema si se actualiza el kernel
  tasks:

    - name: Buscar advisory por CVE
      shell: dnf updateinfo list cves | grep -i "{{ cve_id }}"
      args:
        executable: /bin/bash
      register: cve_search
      changed_when: false

    - name: Extraer ID del advisory encontrado
      shell: |
        LANG=C dnf updateinfo info --cve {{ cve_id }} | grep "Update ID:" | awk -F': ' '{print $2}' | head -n 1
      args:
        executable: /bin/bash
      register: advisory_id
      changed_when: false
    
    - name: Falla si no se encuentra el advisory
      fail:
        msg: "No se encontró un RHSA para {{ cve_id }}"
      when: advisory_id.stdout is not defined or advisory_id.stdout == ''

    - name: Mostrar advisory que se va a aplicar
      debug:
        msg: "Aplicando advisory {{ advisory_id.stdout }}"

    - name: Aplicar actualización usando el advisory
      shell: dnf -y update --advisory={{ advisory_id.stdout }}
      args:
        executable: /bin/bash
      register: update_result
      changed_when: "'Updated:' in (update_result.stdout + update_result.stderr)"

    - name: se pidió reiniciar
      reboot:
        reboot_timeout: 300
      when: reboot_after_update